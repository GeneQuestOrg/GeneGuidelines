<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Living guidelines, specialists, and clinical trials for rare genetic diseases."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <title>GeneGuidelines — Living guidelines for rare genetic diseases</title>
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://geneguidelines.genequest.org/" />
    <!-- Open Graph (social link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeneGuidelines" />
    <meta property="og:title" content="GeneGuidelines — Living guidelines for rare genetic diseases" />
    <meta
      property="og:description"
      content="Living, source-cited clinical guidelines, specialists, and clinical trials for rare genetic diseases — Fibrous Dysplasia, McCune-Albright, Noonan. Built by the GeneQuest Foundation."
    />
    <meta property="og:url" content="https://geneguidelines.genequest.org/" />
    <meta property="og:image" content="https://geneguidelines.genequest.org/logo.png" />
    <meta property="og:locale" content="en" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GeneGuidelines — Living guidelines for rare genetic diseases" />
    <meta
      name="twitter:description"
      content="Living, source-cited clinical guidelines, specialists, and clinical trials for rare genetic diseases."
    />
    <meta name="twitter:image" content="https://geneguidelines.genequest.org/logo.png" />
    <!-- Structured data (search + AI engines) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalWebPage",
        "name": "GeneGuidelines",
        "url": "https://geneguidelines.genequest.org/",
        "description": "Living, source-cited clinical guidelines, specialists, and clinical trials for rare genetic diseases.",
        "audience": { "@type": "MedicalAudience", "audienceType": ["Patient", "Clinician"] },
        "publisher": { "@type": "Organization", "name": "GeneQuest Foundation", "url": "https://genequest.org/" }
      }
    </script>
    <!--
      Analytics: self-hosted Umami, same instance as genequest.org (cookieless, so no
      consent banner). The product has shipped for months with no measurement at all —
      a diagnosis from July that stayed true: the foundation site knows it gets ~22
      visitors a month, and nobody knows whether anyone reaches the product itself.

      Needs its OWN website id (a separate property in the Umami panel — reusing the
      foundation's would mix two sites into one number). Set VITE_UMAMI_WEBSITE_ID at
      build time; with it unset the script is simply not injected, which is why this
      can ship before the property exists.
    -->
    <script type="module">
      const websiteId = import.meta.env.VITE_UMAMI_WEBSITE_ID;
      if (import.meta.env.PROD && websiteId) {
        const s = document.createElement("script");
        s.defer = true;
        s.src =
          "https://umami.blacktree-a28e1549.polandcentral.azurecontainerapps.io/script.js";
        s.dataset.websiteId = websiteId;
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
